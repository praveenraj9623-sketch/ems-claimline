<section class="voice-panel" aria-label="Live voice call">
  <div class="voice-controls">
    <button type="button" id="voice-start">Start voice call</button>
    <button type="button" id="voice-end" disabled>End call</button>
    <span id="voice-meter" aria-hidden="true" hidden><i></i><i></i><i></i><i></i></span>
    <span id="voice-status" role="status">Ready</span>
  </div>
  <div id="voice-transcript" role="log" aria-label="Call transcript" hidden></div>
  <div id="voice-results" hidden></div>
</section>
